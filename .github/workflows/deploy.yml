name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -r app/requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd ${{ secrets.VPS_PATH }}

            # Clone if repo not present (SSH URL works for private repos)
            if [ ! -d .git ]; then
              git clone --depth 1 git@github.com:grigra27/molt-mail-digest.git .
            fi

            # Update to latest main
            git fetch --all
            git reset --hard origin/main

            # .env must exist on the server
            test -f .env || (echo ".env not found on server" && exit 1)

            docker compose up -d --build
            docker compose ps
