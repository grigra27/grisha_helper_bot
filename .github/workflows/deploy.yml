name: Deploy grisha_helper_bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build the application image (disable only to reuse a verified server image)"
        type: boolean
        default: true

concurrency:
  group: grisha_helper_bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -r app/requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            test "${{ secrets.VPS_PATH }}" = /opt/grisha_helper_bot
            cd "${{ secrets.VPS_PATH }}"

            # Clone if repo not present (SSH URL works for private repos)
            if [ ! -d .git ]; then
              git clone --depth 1 git@github.com:grigra27/grisha_helper_bot.git .
            fi

            # Update to latest main
            git fetch origin main
            git merge --ff-only origin/main

            # .env must exist on the server
            test -f .env || (echo ".env not found on server" && exit 1)

            docker compose config --quiet
            docker volume inspect grisha_helper_bot_appdata >/dev/null
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.build_image }}" = false ]; then
              docker image inspect grisha_helper_bot:latest >/dev/null
              docker compose up -d --no-build
            else
              docker compose up -d --build
            fi
            docker compose ps
